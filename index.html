<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Opening Trainer</title>

<style>
:root {
    --bg: #0d0f12;
    --panel: #15181d;
    --panel-2: #1b1f26;
    --panel-3: #222730;
    --border: #303641;
    --text: #f1f3f5;
    --muted: #9aa3af;
    --accent: #d7dce3;
    --accent-hover: #ffffff;
    --green: #67d391;
    --red: #ed7373;

    --board-light: #d7d9dc;
    --board-dark: #555b63;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #1a1d23 0%, transparent 40%),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button {
    font: inherit;
}

header {
    border-bottom: 1px solid var(--border);
    background: rgba(13, 15, 18, .95);
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(10px);
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    padding: 20px 24px 16px;
}

.header-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

header h1 {
    margin: 0;
    font-size: 1.65rem;
    letter-spacing: -.03em;
}

.header-subtitle {
    color: var(--muted);
    font-size: .85rem;
    margin-top: 5px;
}

.tabs {
    max-width: 1250px;
    margin: auto;
    display: flex;
    gap: 4px;
    padding: 0 24px;
}

.tab {
    background: transparent;
    color: var(--muted);
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: 650;
}

.tab:hover {
    color: var(--text);
}

.tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
}

main {
    width: min(1250px, calc(100% - 32px));
    margin: 28px auto 50px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* =========================
   LEARN PAGE
   ========================= */

.learn-layout {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: 20px;
}

.panel {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,.18);
}

.library {
    padding: 14px;
    height: fit-content;
}

.library-title {
    font-size: .72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 800;
    padding: 5px 8px 12px;
}

.opening-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.opening-button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: 11px 10px;
    border-radius: 9px;
    cursor: pointer;
}

.opening-button:hover {
    background: var(--panel-3);
}

.opening-button.active {
    background: var(--panel-3);
    border-color: var(--border);
}

.opening-name {
    font-weight: 700;
    font-size: .88rem;
}

.opening-difficulty {
    color: var(--muted);
    font-size: .72rem;
    margin-top: 3px;
}

.opening-learned {
    display: inline-block;
    color: var(--green);
    font-size: .66rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: 5px;
}

.lesson-panel {
    padding: 24px;
    min-width: 0;
}

.lesson-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 8px;
}

.lesson-heading h2 {
    margin: 0;
    font-size: clamp(1.4rem, 3vw, 2rem);
    letter-spacing: -.035em;
}

.lesson-description {
    color: var(--muted);
    line-height: 1.55;
    margin: 7px 0 0;
    max-width: 800px;
}

.difficulty-badge {
    white-space: nowrap;
    background: var(--panel-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: .7rem;
    color: var(--muted);
    font-weight: 700;
}

.learned-badge {
    display: none;
    margin-top: 10px;
    color: var(--green);
    font-size: .75rem;
    font-weight: 750;
}

.learned-badge.visible {
    display: block;
}

.progress-wrap {
    margin: 20px 0;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: .72rem;
    margin-bottom: 7px;
}

.progress-track {
    height: 6px;
    border-radius: 99px;
    background: #292e36;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
}

/* BOARD + TEXT */

.board-area {
    display: grid;
    grid-template-columns: minmax(380px, 520px) minmax(400px, 1fr);
    gap: 28px;
    align-items: start;
}

.board-wrap {
    width: 100%;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 5px solid #090a0c;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}

.square.light {
    background: var(--board-light);
}

.square.dark {
    background: var(--board-dark);
}

.square.selected {
    outline: 4px solid #e8e8e8;
    outline-offset: -4px;
}

.square.correct-target::after {
    content: "";
    width: 20%;
    height: 20%;
    border-radius: 50%;
    background: rgba(0,0,0,.28);
    position: absolute;
}

.square.capture-target::after {
    content: "";
    position: absolute;
    inset: 8%;
    border: 5px solid rgba(0,0,0,.3);
    border-radius: 50%;
}

.piece {
    font-family:
        "Times New Roman",
        "DejaVu Serif",
        serif;
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1;
    position: relative;
    z-index: 2;
    pointer-events: none;
}

.white-piece {
    color: #f7f7f7;
    text-shadow:
        0 2px 2px rgba(0,0,0,.9),
        0 0 1px #000;
}

.black-piece {
    color: #111;
    text-shadow:
        0 1px 1px rgba(255,255,255,.15);
}

.lesson-content {
    min-width: 0;
    background: #111419;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 22px;
}

.lesson-stage {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .11em;
    font-size: .67rem;
    font-weight: 800;
    margin-bottom: 10px;
}

.lesson-title {
    margin: 0 0 12px;
    font-size: 1.25rem;
}

.lesson-text {
    color: #d8dce1;
    line-height: 1.7;
    font-size: .97rem;
    white-space: pre-line;
}

.prompt {
    margin-top: 20px;
    padding: 14px 15px;
    background: var(--panel-3);
    border: 1px solid var(--border);
    border-radius: 9px;
}

.prompt-label {
    color: var(--muted);
    text-transform: uppercase;
    font-size: .64rem;
    letter-spacing: .1em;
    font-weight: 800;
    margin-bottom: 5px;
}

.prompt-text {
    font-weight: 700;
}

.feedback {
    min-height: 24px;
    margin-top: 13px;
    font-size: .88rem;
    font-weight: 650;
}

.feedback.good {
    color: var(--green);
}

.feedback.bad {
    color: var(--red);
}

.lesson-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
}

.action-button {
    background: var(--panel-3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
}

.action-button:hover {
    border-color: #555d69;
    background: #292e36;
}

.action-button.primary {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: 750;
}

.action-button.primary:hover {
    background: var(--accent-hover);
}

.variations {
    margin-top: 18px;
}

.variations-title {
    color: var(--muted);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 800;
    margin-bottom: 8px;
}

.variation-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.variation-item {
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    font-size: .82rem;
}

.variation-item strong {
    display: block;
    margin-bottom: 3px;
}

.variation-item span {
    color: var(--muted);
}

/* =========================
   REPERTOIRE
   ========================= */

.repertoire-header {
    margin-bottom: 20px;
}

.repertoire-header h2 {
    margin: 0 0 5px;
}

.repertoire-header p {
    color: var(--muted);
    margin: 0;
}

.repertoire-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
}

.repertoire-card {
    padding: 18px;
}

.repertoire-card h3 {
    margin: 0 0 6px;
}

.repertoire-card p {
    color: var(--muted);
    line-height: 1.5;
    font-size: .88rem;
}

.repertoire-card button {
    margin-top: 8px;
}

/* =========================
   PRACTICE
   ========================= */

.placeholder {
    padding: 35px;
    text-align: center;
}

.placeholder h2 {
    margin-top: 0;
}

.placeholder p {
    color: var(--muted);
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 950px) {
    .learn-layout {
        grid-template-columns: 1fr;
    }

    .library {
        order: 0;
    }

    .opening-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }

    .board-area {
        grid-template-columns: 1fr;
    }

    .board-wrap {
        max-width: 600px;
        margin: auto;
    }
}

@media (max-width: 600px) {
    main {
        width: min(100% - 18px, 1250px);
        margin-top: 15px;
    }

    .header-inner {
        padding: 16px 12px 10px;
    }

    .tabs {
        padding: 0 10px;
    }

    .lesson-panel {
        padding: 15px;
    }

    .lesson-heading {
        flex-direction: column;
        gap: 10px;
    }

    .lesson-content {
        padding: 16px;
    }

    .board-area {
        gap: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="header-title">
            <div>
                <h1>Chess Opening Trainer</h1>
                <div class="header-subtitle">
                    Learn openings by playing the moves yourself.
                </div>
            </div>
        </div>
    </div>

    <nav class="tabs">
        <button class="tab" data-tab="practice">Practice</button>
        <button class="tab active" data-tab="learn">Learn</button>
        <button class="tab" data-tab="repertoire">Repertoire</button>
    </nav>
</header>

<main>

    <!-- =========================
         PRACTICE
         ========================= -->

    <section id="practice" class="page">
        <div class="panel placeholder">
            <h2>Practice</h2>
            <p>
                Practice mode will go here.
            </p>
        </div>
    </section>

    <!-- =========================
         LEARN
         ========================= -->

    <section id="learn" class="page active">

        <div class="learn-layout">

            <aside class="panel library">
                <div class="library-title">
                    Opening Library
                </div>

                <div class="opening-list" id="openingList"></div>
            </aside>

            <section class="panel lesson-panel">

                <div class="lesson-heading">
                    <div>
                        <h2 id="openingTitle"></h2>
                        <p class="lesson-description" id="openingDescription"></p>
                        <div class="learned-badge" id="learnedBadge">
                            ✓ Opening learned
                        </div>
                    </div>

                    <div class="difficulty-badge" id="openingDifficulty"></div>
                </div>

                <div class="progress-wrap">
                    <div class="progress-label">
                        <span>Course progress</span>
                        <span id="progressText">0%</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

                <div class="board-area">

                    <div class="board-wrap">
                        <div class="board" id="board"></div>
                    </div>

                    <div class="lesson-content">

                        <div class="lesson-stage" id="lessonStage"></div>

                        <h3 class="lesson-title" id="lessonTitle"></h3>

                        <div class="lesson-text" id="lessonText"></div>

                        <div class="prompt">
                            <div class="prompt-label">Your move</div>
                            <div class="prompt-text" id="movePrompt"></div>
                        </div>

                        <div class="feedback" id="feedback"></div>

                        <div class="lesson-actions">
                            <button class="action-button" id="hintBtn">
                                Hint
                            </button>

                            <button class="action-button" id="explainBtn">
                                Explain Further
                            </button>
                        </div>

                        <div class="variations">
                            <div class="variations-title">
                                Variations
                            </div>

                            <div class="variation-list" id="variationList"></div>
                        </div>

                    </div>

                </div>

            </section>
        </div>
    </section>

    <!-- =========================
         REPERTOIRE
         ========================= -->

    <section id="repertoire" class="page">

        <div class="repertoire-header">
            <h2>Your Repertoire</h2>
            <p>
                Openings you've completed will appear here.
            </p>
        </div>

        <div class="repertoire-grid" id="repertoireGrid"></div>

    </section>

</main>

<script>

/* ============================================================
   ============================================================
   
   OPENING DATA
   
   THIS IS THE IMPORTANT PART.
   
   To add another opening:
   
   1. Copy the entire object inside OPENINGS.
   2. Give it a new id.
   3. Change the name/description/difficulty.
   4. Add its introSteps.
   5. Add as many variations as you want.
   
   YOU DO NOT NEED TO CHANGE THE ENGINE BELOW.
   
   To add a variation:
   
       variations: {
           myVariation: {
               name: "My Variation",
               description: "What this variation is about.",
               steps: [
                   {
                       from: "g1",
                       to: "f3",
                       text: "Develop the knight.",
                       opponent: {
                           from: "b8",
                           to: "c6"
                       }
                   }
               ],
               summary: "What the player should remember."
           }
       }
   
   "opponent" means the opponent makes that move BEFORE
   the player is asked to make the current move.
   
   The first step normally has no opponent move.
   
   ============================================================
   ============================================================ */


const OPENINGS = {

    /* ========================================================
       SCOTCH GAMBIT
       ======================================================== */

    scotchGambit: {

        id: "scotchGambit",

        name: "Scotch Gambit",

        difficulty: "Intermediate",

        description:
            "An aggressive open game beginning with 1.e4 e5 2.Nf3 Nc6 3.d4. " +
            "White immediately challenges the center and aims for rapid development.",

        introSteps: [

            {
                from: "e2",
                to: "e4",
                text:
                    "Start with 1.e4. White immediately claims central space " +
                    "and opens lines for the queen and king bishop.",
                prompt:
                    "Play 1.e4."
            },

            {
                from: "g1",
                to: "f3",
                opponent: {
                    from: "e7",
                    to: "e5"
                },
                text:
                    "Black answers with ...e5. Develop the knight to f3, " +
                    "attacking the e5-pawn and preparing to fight for the center.",
                prompt:
                    "Play 2.Nf3."
            },

            {
                from: "d2",
                to: "d4",
                opponent: {
                    from: "b8",
                    to: "c6"
                },
                text:
                    "Black develops with ...Nc6. Now strike immediately with d4. " +
                    "This is the move that creates the Scotch structure.",
                prompt:
                    "Play 3.d4."
            },

            {
                from: "f1",
                to: "c4",
                opponent: {
                    from: "e5",
                    to: "d4"
                },
                text:
                    "Black captures on d4. Develop the bishop to c4 and put pressure " +
                    "on the f7-square. White has entered the Scotch Gambit.",
                prompt:
                    "Play 4.Bc4."
            }

        ],

        variations: {

            dubois: {

                name: "Dubois-Réti Defense",

                description:
                    "Black develops the knight to f6 and challenges White's center.",

                steps: [

                    {
                        from: "e4",
                        to: "e5",

                        opponent: {
                            from: "g8",
                            to: "f6"
                        },

                        text:
                            "Black plays ...Nf6, immediately attacking the e4-pawn. " +
                            "Push e5 to gain space and force the knight to make a decision.",

                        prompt:
                            "Play e5."
                    }

                ],

                summary:
                    "Against ...Nf6, e5 gains space and makes Black's knight decide where to go."
            },

            haxo: {

                name: "Haxo Gambit",

                description:
                    "A sharp continuation where White uses c3 and Bxf7+ to generate tactical pressure.",

                steps: [

                    {
                        from: "c2",
                        to: "c3",

                        opponent: {
                            from: "f8",
                            to: "c5"
                        },

                        text:
                            "Black develops the bishop to c5. Play c3, challenging the d4-pawn " +
                            "and preparing to build a strong center.",

                        prompt:
                            "Play c3."
                    },

                    {
                        from: "c4",
                        to: "f7",

                        opponent: {
                            from: "d4",
                            to: "c3"
                        },

                        text:
                            "Black takes on c3. Now Bxf7+ is the tactical idea: " +
                            "the bishop crashes into f7 with check.",

                        prompt:
                            "Play Bxf7+.",
                        tactic: true
                    },

                    {
                        from: "d1",
                        to: "d5",

                        opponent: {
                            from: "e8",
                            to: "f7"
                        },

                        text:
                            "The king takes the bishop. Qd5+ keeps the initiative " +
                            "and attacks the exposed king.",

                        prompt:
                            "Play Qd5+.",
                        tactic: true
                    }

                ],

                summary:
                    "The Haxo Gambit sacrifices the bishop on f7 to drag the king out and gain attacking chances."
            },

            h6: {

                name: "...h6 Line",

                description:
                    "Black plays ...h6, giving White time to castle before continuing the attack.",

                steps: [

                    {
                        from: "e1",
                        to: "g1",

                        opponent: {
                            from: "h7",
                            to: "h6"
                        },

                        special: "castle",

                        text:
                            "Black spends a tempo on ...h6. Castle immediately. " +
                            "There is no reason to delay king safety.",

                        prompt:
                            "Castle kingside.",
                    },

                    {
                        from: "e4",
                        to: "e5",

                        opponent: {
                            from: "g8",
                            to: "f6"
                        },

                        text:
                            "Black develops with ...Nf6. Push e5 to gain space " +
                            "and make the knight find a new square.",

                        prompt:
                            "Play e5."
                    }

                ],

                summary:
                    "When Black wastes a tempo with ...h6, White should generally prioritize castling and development."
            }
        },

        keyIdeas: [

            "Fight for the center immediately with d4.",

            "Develop rapidly instead of spending tempi on unnecessary pawn moves.",

            "The bishop on c4 puts pressure on f7, Black's weakest point in the opening.",

            "The Scotch Gambit is about activity and development in exchange for the pawn."
        ]
    }

    /*
    
    ============================================================
    COPY THIS TEMPLATE TO ADD ANOTHER OPENING
    ============================================================
    
    ,,

    italianGame: {

        id: "italianGame",

        name: "Italian Game",

        difficulty: "Beginner",

        description:
            "A classical opening beginning with 1.e4 e5 2.Nf3 Nc6 3.Bc4.",

        introSteps: [

            {
                from: "e2",
                to: "e4",
                text: "Play e4.",
                prompt: "Play 1.e4."
            },

            {
                from: "g1",
                to: "f3",

                opponent: {
                    from: "e7",
                    to: "e5"
                },

                text: "Develop the knight.",
                prompt: "Play Nf3."
            },

            {
                from: "f1",
                to: "c4",

                opponent: {
                    from: "b8",
                    to: "c6"
                },

                text: "Develop the bishop.",
                prompt: "Play Bc4."
            }
        ],

        variations: {

            giuocoPiano: {

                name: "Giuoco Piano",

                description:
                    "A calm Italian variation.",

                steps: [

                    {
                        from: "c2",
                        to: "c3",

                        opponent: {
                            from: "f8",
                            to: "c5"
                        },

                        text:
                            "Prepare d4 with c3.",

                        prompt:
                            "Play c3."
                    }
                ],

                summary:
                    "The Giuoco Piano allows White to build a strong center."
            }
        },

        keyIdeas: [
            "Develop quickly.",
            "Castle early.",
            "Fight for the center."
        ]
    }

    ============================================================
    */

};


/* ============================================================
   PIECE DATA
   ============================================================ */

const PIECES = {

    white: {
        k: "♔",
        q: "♕",
        r: "♖",
        b: "♗",
        n: "♘",
        p: "♙"
    },

    black: {
        k: "♚",
        q: "♛",
        r: "♜",
        b: "♝",
        n: "♞",
        p: "♟"
    }

};


/* ============================================================
   STANDARD STARTING POSITION
   ============================================================ */

const STANDARD_POSITION = {

    a8: "br",
    b8: "bn",
    c8: "bb",
    d8: "bq",
    e8: "bk",
    f8: "bb",
    g8: "bn",
    h8: "br",

    a7: "bp",
    b7: "bp",
    c7: "bp",
    d7: "bp",
    e7: "bp",
    f7: "bp",
    g7: "bp",
    h7: "bp",

    a2: "wp",
    b2: "wp",
    c2: "wp",
    d2: "wp",
    e2: "wp",
    f2: "wp",
    g2: "wp",
    h2: "wp",

    a1: "wr",
    b1: "wn",
    c1: "wb",
    d1: "wq",
    e1: "wk",
    f1: "wb",
    g1: "wn",
    h1: "wr"
};


/* ============================================================
   STATE
   ============================================================ */

let currentOpeningId = Object.keys(OPENINGS)[0];

let pieces = {};

let selectedSquare = null;

let inputLocked = false;

let currentStage = "intro";

let currentStep = 0;

let wrongAttempts = 0;

let completedBranches = new Set();

let progress = {
    learned: {},
    completed: {}
};


/* ============================================================
   DOM
   ============================================================ */

const boardEl = document.getElementById("board");

const openingListEl =
    document.getElementById("openingList");

const openingTitleEl =
    document.getElementById("openingTitle");

const openingDescriptionEl =
    document.getElementById("openingDescription");

const openingDifficultyEl =
    document.getElementById("openingDifficulty");

const learnedBadgeEl =
    document.getElementById("learnedBadge");

const lessonStageEl =
    document.getElementById("lessonStage");

const lessonTitleEl =
    document.getElementById("lessonTitle");

const lessonTextEl =
    document.getElementById("lessonText");

const movePromptEl =
    document.getElementById("movePrompt");

const feedbackEl =
    document.getElementById("feedback");

const variationListEl =
    document.getElementById("variationList");

const progressBarEl =
    document.getElementById("progressBar");

const progressTextEl =
    document.getElementById("progressText");

const repertoireGridEl =
    document.getElementById("repertoireGrid");


/* ============================================================
   STORAGE
   ============================================================ */

const STORAGE_KEY =
    "chessOpeningTrainerProgress";

function loadProgress() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        const parsed =
            JSON.parse(saved);

        if (parsed && typeof parsed === "object") {
            progress = {
                learned: parsed.learned || {},
                completed: parsed.completed || {}
            };
        }

    } catch (error) {

        console.warn(
            "Could not load saved progress.",
            error
        );

    }
}


function saveProgress() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(progress)
    );
}


function isLearned(openingId) {

    return !!progress.learned[openingId];

}


/* ============================================================
   OPENING HELPERS
   ============================================================ */

function getOpening() {

    return OPENINGS[currentOpeningId];

}


function getStages(opening) {

    return [
        {
            id: "intro",
            name: "Opening Introduction",
            steps: opening.introSteps
        },

        ...Object.entries(opening.variations)
            .map(([id, variation]) => ({
                id,
                name: variation.name,
                steps: variation.steps
            }))
    ];

}


function getCurrentStageObject() {

    const opening = getOpening();

    return getStages(opening)
        .find(stage => stage.id === currentStage);

}


function getCurrentStep() {

    const stage =
        getCurrentStageObject();

    return stage?.steps[currentStep];

}


/* ============================================================
   BOARD HELPERS
   ============================================================ */

function clonePosition(position) {

    return JSON.parse(
        JSON.stringify(position)
    );

}


function applyMove(position, move) {

    if (!move) return;

    const piece =
        position[move.from];

    if (!piece) return;

    position[move.to] = piece;

    delete position[move.from];

}


function applySpecialMove(position, move) {

    if (!move) return;

    if (move.special === "castle") {

        applyMove(position, {
            from: move.from,
            to: move.to
        });

        const rookFrom =
            move.to === "g1"
                ? "h1"
                : "a1";

        const rookTo =
            move.to === "g1"
                ? "f1"
                : "d1";

        applyMove(position, {
            from: rookFrom,
            to: rookTo
        });

        return;
    }

    applyMove(position, move);
}


/*
    Builds the position after the entire opening intro.

    This is what makes every variation automatically start
    from the correct position without needing separate
    hardcoded reset functions.
*/

function buildOpeningBasePosition() {

    const opening = getOpening();

    const position =
        clonePosition(
            opening.startingPosition ||
            STANDARD_POSITION
        );

    for (const step of opening.introSteps) {

        if (step.opponent) {
            applyMove(position, step.opponent);
        }

        applySpecialMove(position, step);
    }

    return position;
}


function resetToOpeningStart() {

    const opening = getOpening();

    pieces =
        clonePosition(
            opening.startingPosition ||
            STANDARD_POSITION
        );

    selectedSquare = null;

}


function resetToOpeningBase() {

    pieces =
        buildOpeningBasePosition();

    selectedSquare = null;

}


/* ============================================================
   BOARD RENDERING
   ============================================================ */

function squareName(file, rank) {

    return file + rank;

}


function renderBoard() {

    boardEl.innerHTML = "";

    const files =
        ["a","b","c","d","e","f","g","h"];

    for (let rank = 8; rank >= 1; rank--) {

        for (const file of files) {

            const square =
                squareName(file, rank);

            const el =
                document.createElement("div");

            const fileIndex =
                files.indexOf(file);

            const light =
                (fileIndex + rank) % 2 === 1;

            el.className =
                "square " +
                (light ? "light" : "dark");

            el.dataset.square = square;

            if (square === selectedSquare) {
                el.classList.add("selected");
            }

            const pieceCode =
                pieces[square];

            if (pieceCode) {

                const color =
                    pieceCode[0] === "w"
                        ? "white"
                        : "black";

                const type =
                    pieceCode[1];

                const pieceEl =
                    document.createElement("span");

                pieceEl.className =
                    "piece " +
                    (color === "white"
                        ? "white-piece"
                        : "black-piece");

                pieceEl.textContent =
                    PIECES[color][type];

                el.appendChild(pieceEl);
            }

            el.addEventListener(
                "click",
                () => handleSquareClick(square)
            );

            boardEl.appendChild(el);
        }
    }

    renderTargets();
}


function renderTargets() {

    if (!selectedSquare) return;

    const step =
        getCurrentStep();

    if (!step) return;

    const target =
        step.to;

    const targetEl =
        boardEl.querySelector(
            `[data-square="${target}"]`
        );

    if (targetEl) {

        if (pieces[target]) {
            targetEl.classList.add(
                "capture-target"
            );
        } else {
            targetEl.classList.add(
                "correct-target"
            );
        }

    }
}


/* ============================================================
   INPUT
   ============================================================ */

function handleSquareClick(square) {

    if (inputLocked) return;

    const step =
        getCurrentStep();

    if (!step) return;

    const piece =
        pieces[square];

    /*
       If a piece is already selected, clicking another
       square attempts the move.
    */

    if (selectedSquare) {

        if (
            selectedSquare === step.from &&
            square === step.to
        ) {

            completeCurrentMove();

            return;
        }

        /*
           Clicking another white piece switches selection.
        */

        if (
            piece &&
            piece[0] === "w"
        ) {

            selectedSquare = square;

            renderBoard();

            return;
        }

        showWrongMove();

        return;
    }

    /*
       Only the correct white piece can be selected.
    */

    if (
        piece &&
        piece[0] === "w"
    ) {

        selectedSquare = square;

        renderBoard();

        return;
    }

    showWrongMove();
}


/* ============================================================
   MOVE COMPLETION
   ============================================================ */

function completeCurrentMove() {

    const step =
        getCurrentStep();

    if (!step) return;

    inputLocked = true;

    feedbackEl.className =
        "feedback good";

    feedbackEl.textContent =
        "Correct!";

    applySpecialMove(pieces, step);

    selectedSquare = null;

    renderBoard();

    setTimeout(() => {

        currentStep++;

        if (
            currentStep >=
            getCurrentStageObject().steps.length
        ) {

            finishStage();

        } else {

            enterStep();

        }

    }, 550);
}


/* ============================================================
   OPPONENT MOVES
   ============================================================ */

function enterStep() {

    inputLocked = false;

    wrongAttempts = 0;

    const step =
        getCurrentStep();

    if (!step) return;

    /*
       The opponent move happens before the player
       is presented with the current move.
    */

    if (step.opponent) {

        applyMove(
            pieces,
            step.opponent
        );
    }

    selectedSquare = null;

    renderBoard();

    updateLesson();

}


/* ============================================================
   LESSON UI
   ============================================================ */

function updateLesson() {

    const opening =
        getOpening();

    const stage =
        getCurrentStageObject();

    const step =
        getCurrentStep();

    if (!stage || !step) return;

    openingTitleEl.textContent =
        opening.name;

    openingDescriptionEl.textContent =
        opening.description;

    openingDifficultyEl.textContent =
        opening.difficulty;

    learnedBadgeEl.classList.toggle(
        "visible",
        isLearned(opening.id)
    );

    lessonStageEl.textContent =
        stage.name;

    lessonTitleEl.textContent =
        stage.id === "intro"
            ? `Move ${currentStep + 1}`
            : `${stage.name} — Move ${currentStep + 1}`;

    lessonTextEl.textContent =
        step.text || "";

    movePromptEl.textContent =
        step.prompt ||
        `Play ${step.from} → ${step.to}.`;

    feedbackEl.className =
        "feedback";

    feedbackEl.textContent =
        "";

    updateVariationList();

    updateProgress();

}


function updateVariationList() {

    variationListEl.innerHTML = "";

    const opening =
        getOpening();

    for (
        const [id, variation]
        of Object.entries(opening.variations)
    ) {

        const item =
            document.createElement("div");

        item.className =
            "variation-item";

        const completed =
            completedBranches.has(id);

        item.innerHTML = `
            <strong>
                ${variation.name}
                ${completed ? " ✓" : ""}
            </strong>
            <span>${variation.description}</span>
        `;

        variationListEl.appendChild(item);
    }
}


/* ============================================================
   PROGRESS
   ============================================================ */

function updateProgress() {

    const stages =
        getStages(getOpening());

    const stageIndex =
        stages.findIndex(
            stage => stage.id === currentStage
        );

    const currentStageSteps =
        stages[stageIndex]?.steps.length || 1;

    const completedBefore =
        stages
            .slice(0, stageIndex)
            .reduce(
                (total, stage) =>
                    total + stage.steps.length,
                0
            );

    const totalSteps =
        stages.reduce(
            (total, stage) =>
                total + stage.steps.length,
            0
        );

    const completedSteps =
        completedBefore + currentStep;

    const percent =
        totalSteps === 0
            ? 0
            : Math.round(
                (completedSteps / totalSteps) * 100
            );

    progressBarEl.style.width =
        `${percent}%`;

    progressTextEl.textContent =
        `${percent}%`;

}


/* ============================================================
   WRONG MOVE / HINTS
   ============================================================ */

function showWrongMove() {

    wrongAttempts++;

    feedbackEl.className =
        "feedback bad";

    const step =
        getCurrentStep();

    if (
        step.tactic &&
        wrongAttempts >= 2
    ) {

        feedbackEl.textContent =
            `Look for the tactical idea: ${step.from} → ${step.to}.`;

    } else {

        feedbackEl.textContent =
            "That's not the move. Try again.";

    }

}


document
    .getElementById("hintBtn")
    .addEventListener("click", () => {

        const step =
            getCurrentStep();

        if (!step) return;

        feedbackEl.className =
            "feedback";

        feedbackEl.textContent =
            `Hint: move the piece on ${step.from} to ${step.to}.`;
    });


document
    .getElementById("explainBtn")
    .addEventListener("click", () => {

        const step =
            getCurrentStep();

        if (!step) return;

        feedbackEl.className =
            "feedback";

        feedbackEl.textContent =
            step.text ||
            "This move is part of the opening's main idea.";
    });


/* ============================================================
   STAGE COMPLETION
   ============================================================ */

function finishStage() {

    inputLocked = true;

    updateProgress();

    const opening =
        getOpening();

    const stages =
        getStages(opening);

    const stageIndex =
        stages.findIndex(
            stage => stage.id === currentStage
        );

    if (currentStage === "intro") {

        showIntroComplete();

        return;
    }

    completedBranches.add(
        currentStage
    );

    if (!progress.completed[opening.id]) {
        progress.completed[opening.id] = [];
    }

    if (
        !progress.completed[opening.id]
            .includes(currentStage)
    ) {

        progress.completed[opening.id]
            .push(currentStage);
    }

    saveProgress();

    updateVariationList();

    const nextStage =
        stages[stageIndex + 1];

    if (nextStage) {

        showStageComplete(nextStage);

    } else {

        markOpeningLearned();

        showOpeningComplete();

    }
}


function showIntroComplete() {

    const opening =
        getOpening();

    const firstVariation =
        Object.entries(opening.variations)[0];

    lessonStageEl.textContent =
        "Opening complete";

    lessonTitleEl.textContent =
        `${opening.name} basics complete`;

    lessonTextEl.textContent =
        `You now know the basic ${opening.name} move order. ` +
        `Next, learn how to respond to different defenses.`;

    movePromptEl.textContent =
        firstVariation
            ? `Continue to ${firstVariation[1].name}.`
            : "The opening is complete.";

    feedbackEl.className =
        "feedback good";

    feedbackEl.textContent =
        "Nice.";

    renderContinueButton(
        firstVariation
            ? firstVariation[0]
            : null
    );
}


function showStageComplete(nextStage) {

    const opening =
        getOpening();

    const variation =
        opening.variations[currentStage];

    lessonStageEl.textContent =
        "Variation complete";

    lessonTitleEl.textContent =
        variation.name;

    lessonTextEl.textContent =
        variation.summary ||
        variation.description ||
        "";

    movePromptEl.textContent =
        `Continue to ${nextStage.name}.`;

    feedbackEl.className =
        "feedback good";

    feedbackEl.textContent =
        "Variation learned.";

    renderContinueButton(
        nextStage.id
    );
}


function showOpeningComplete() {

    const opening =
        getOpening();

    lessonStageEl.textContent =
        "Opening learned";

    lessonTitleEl.textContent =
        `${opening.name} complete`;

    lessonTextEl.textContent =
        opening.keyIdeas?.join("\n\n") ||
        "You have completed this opening.";

    movePromptEl.textContent =
        "You can review the opening or choose another one.";

    feedbackEl.className =
        "feedback good";

    feedbackEl.textContent =
        "✓ Added to your repertoire.";

    renderContinueButton(null);
}


function renderContinueButton(nextStageId) {

    document
        .querySelectorAll(".continue-button")
        .forEach(button => button.remove());

    const button =
        document.createElement("button");

    button.className =
        "action-button primary continue-button";

    if (nextStageId) {

        const opening =
            getOpening();

        const stages =
            getStages(opening);

        const nextStage =
            stages.find(
                stage => stage.id === nextStageId
            );

        button.textContent =
            `Continue: ${nextStage.name}`;

        button.addEventListener(
            "click",
            () => advanceToStage(nextStageId)
        );

    } else {

        button.textContent =
            "Review Opening";

        button.addEventListener(
            "click",
            () => resetCurrentOpening()
        );
    }

    document
        .querySelector(".lesson-actions")
        .appendChild(button);
}


/* ============================================================
   STAGE NAVIGATION
   ============================================================ */

function advanceToStage(stageId) {

    currentStage =
        stageId;

    currentStep =
        0;

    wrongAttempts =
        0;

    resetToOpeningBase();

    enterStep();

}


function resetCurrentOpening() {

    currentStage =
        "intro";

    currentStep =
        0;

    wrongAttempts =
        0;

    completedBranches =
        new Set(
            progress.completed[currentOpeningId] || []
        );

    document
        .querySelectorAll(".continue-button")
        .forEach(button => button.remove());

    resetToOpeningStart();

    enterStep();

}


/* ============================================================
   LEARNED STATE
   ============================================================ */

function markOpeningLearned() {

    progress.learned[currentOpeningId] =
        true;

    saveProgress();

    updateOpeningLibrary();

    updateRepertoire();

    learnedBadgeEl.classList.add(
        "visible"
    );
}


/* ============================================================
   OPENING SELECTION
   ============================================================ */

function selectOpening(openingId) {

    if (!OPENINGS[openingId]) return;

    currentOpeningId =
        openingId;

    completedBranches =
        new Set(
            progress.completed[openingId] || []
        );

    resetCurrentOpening();

    updateOpeningLibrary();

}


function updateOpeningLibrary() {

    openingListEl.innerHTML = "";

    for (
        const [id, opening]
        of Object.entries(OPENINGS)
    ) {

        const button =
            document.createElement("button");

        button.className =
            "opening-button";

        if (id === currentOpeningId) {
            button.classList.add("active");
        }

        button.innerHTML = `
            <div class="opening-name">
                ${opening.name}
            </div>

            <div class="opening-difficulty">
                ${opening.difficulty}
            </div>

            ${
                isLearned(id)
                    ? `<div class="opening-learned">
                           ✓ Learned
                       </div>`
                    : ""
            }
        `;

        button.addEventListener(
            "click",
            () => selectOpening(id)
        );

        openingListEl.appendChild(button);
    }
}


/* ============================================================
   REPERTOIRE
   ============================================================ */

function updateRepertoire() {

    repertoireGridEl.innerHTML = "";

    const learned =
        Object.entries(OPENINGS)
            .filter(([id]) => isLearned(id));

    if (learned.length === 0) {

        repertoireGridEl.innerHTML = `
            <div class="panel placeholder">
                <h3>No openings learned yet</h3>
                <p>
                    Complete an opening in the Learn tab
                    and it will appear here.
                </p>
            </div>
        `;

        return;
    }

    for (
        const [id, opening]
        of learned
    ) {

        const card =
            document.createElement("div");

        card.className =
            "panel repertoire-card";

        card.innerHTML = `
            <h3>${opening.name}</h3>

            <p>
                ${opening.description}
            </p>

            <button class="action-button primary">
                Review
            </button>
        `;

        card
            .querySelector("button")
            .addEventListener(
                "click",
                () => {

                    selectOpening(id);

                    switchTab("learn");
                }
            );

        repertoireGridEl.appendChild(card);
    }
}


/* ============================================================
   TABS
   ============================================================ */

function switchTab(tabName) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.toggle(
                "active",
                page.id === tabName
            );
        });

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.tab === tabName
            );
        });

}


document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            () => switchTab(tab.dataset.tab)
        );

    });


/* ============================================================
   INITIALIZATION
   ============================================================ */

loadProgress();

updateOpeningLibrary();

updateRepertoire();

resetCurrentOpening();

</script>

</body>
</html>
