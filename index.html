<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Opening Trainer</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #111315;
        --panel: #1b1e21;
        --panel-2: #22262a;
        --border: #34393e;
        --text: #f2f2f2;
        --muted: #a6abb0;
        --muted-2: #777d83;
        --button: #292e33;
        --button-hover: #353b41;
        --accent: #d8d8d8;
        --good: #55c878;
        --bad: #ef6262;

        --board-light: #f0d9b5;
        --board-dark: #b58863;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    button {
        font: inherit;
    }

    header {
        background: #090a0b;
        color: white;
        padding: 18px 24px 0;
        border-bottom: 1px solid var(--border);
    }

    header h1 {
        max-width: 1250px;
        margin: 0 auto 16px;
        font-size: 24px;
    }

    .tabs {
        display: flex;
        gap: 6px;
        max-width: 1250px;
        margin: auto;
    }

    .tab {
        border: 0;
        background: transparent;
        color: #777;
        padding: 12px 20px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
    }

    .tab:hover {
        color: #bbb;
    }

    .tab.active {
        color: white;
        border-bottom-color: white;
    }

    main {
        max-width: 1250px;
        margin: auto;
        padding: 28px 20px 50px;
    }

    .page {
        display: none;
    }

    .page.active {
        display: block;
    }

    .page-header {
        margin-bottom: 24px;
    }

    .page-header h2 {
        margin: 0 0 7px;
        font-size: 28px;
    }

    .page-header p {
        margin: 0;
        color: var(--muted);
    }

    /*
       The sidebar is intentionally narrower than the old version.
       The extra width goes to the actual lesson.
    */
    .learn-layout {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
    }

    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
    }

    .panel h3 {
        margin: 0 0 14px;
    }

    .opening-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .opening {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 7px;
        padding: 12px;
        cursor: pointer;
    }

    .opening:hover,
    .opening.selected {
        background: var(--button-hover);
        border-color: #666;
    }

    .opening:disabled {
        cursor: default;
        opacity: .55;
    }

    .opening-name {
        display: block;
        font-weight: bold;
        margin-bottom: 4px;
    }

    .opening-meta {
        color: var(--muted);
        font-size: 13px;
    }

    .learned-badge {
        display: inline-block;
        margin-top: 7px;
        padding: 3px 7px;
        border-radius: 999px;
        background: #30353a;
        color: #ccc;
        font-size: 11px;
        font-weight: bold;
    }

    .lesson-top {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 18px;
    }

    .lesson-top h3 {
        margin: 0 0 6px;
        font-size: 24px;
    }

    .difficulty {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 12px;
        color: var(--muted);
        height: fit-content;
        white-space: nowrap;
    }

    /*
       IMPORTANT:
       The board itself is intentionally fixed at 520x520,
       matching the old file.

       The lesson content gets the remaining horizontal space.
    */
    .board-area {
        display: grid;
        grid-template-columns: 520px minmax(400px, 1fr);
        gap: 28px;
        align-items: start;
    }

    .board-wrapper {
        width: 520px;
    }

    .board {
        width: 520px;
        height: 520px;
        display: grid;
        grid-template-columns: repeat(8, 65px);
        grid-template-rows: repeat(8, 65px);
        border: 2px solid #080808;
        overflow: hidden;
    }

    .square {
        width: 65px;
        height: 65px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
    }

    .square.light {
        background: var(--board-light);
    }

    .square.dark {
        background: var(--board-dark);
    }

    .square.selected {
        outline: 4px solid #555;
        outline-offset: -4px;
    }

    /*
       ORIGINAL PIECE DIMENSIONS / ARTWORK
    */
    .piece {
        width: 84%;
        height: 84%;
        display: block;
        pointer-events: none;
        user-select: none;
    }

    .lesson-content {
        min-height: 330px;
    }

    .lesson-content h4 {
        margin: 0 0 10px;
        font-size: 18px;
    }

    .lesson-text {
        line-height: 1.55;
        color: #d1d4d7;
        margin-bottom: 18px;
    }

    .move-prompt {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        font-weight: bold;
    }

    .feedback {
        min-height: 42px;
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.45;
    }

    .feedback.correct {
        color: var(--good);
    }

    .feedback.wrong {
        color: var(--bad);
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .primary,
    .secondary,
    .variation-button {
        border-radius: 7px;
        padding: 10px 15px;
        cursor: pointer;
    }

    .primary {
        border: 0;
        background: #eee;
        color: #111;
    }

    .primary:hover {
        background: #fff;
    }

    .secondary {
        border: 1px solid var(--border);
        background: var(--button);
        color: var(--text);
    }

    .secondary:hover {
        background: var(--button-hover);
    }

    .variation-list {
        display: grid;
        gap: 9px;
        margin-top: 16px;
    }

    .variation-button {
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        text-align: left;
    }

    .variation-button:hover,
    .variation-button.selected {
        background: var(--button-hover);
        border-color: #777;
    }

    .variation-button strong {
        display: block;
        margin-bottom: 3px;
    }

    .variation-button span {
        color: var(--muted);
        font-size: 12px;
    }

    .progress {
        width: 520px;
        height: 6px;
        background: #303438;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 20px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: #aaa;
        transition: width .25s ease;
    }

    .summary {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin-top: 15px;
        line-height: 1.55;
    }

    .hidden {
        display: none !important;
    }

    .placeholder {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 30px;
        color: var(--muted);
    }

    .repertoire-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 12px;
    }

    .repertoire-card h3 {
        margin: 0 0 7px;
    }

    .repertoire-card p {
        color: var(--muted);
        margin: 0 0 14px;
    }

    @media (max-width: 1050px) {
        .board-area {
            grid-template-columns: 520px 1fr;
        }

        .lesson-content {
            min-width: 0;
        }
    }

    @media (max-width: 850px) {
        .learn-layout {
            grid-template-columns: 1fr;
        }

        .board-area {
            grid-template-columns: 1fr;
        }

        .board-wrapper {
            width: 520px;
            max-width: 100%;
            overflow-x: auto;
        }

        .lesson-content {
            min-width: 0;
        }
    }

    @media (max-width: 600px) {
        main {
            padding-left: 12px;
            padding-right: 12px;
        }

        header {
            padding-left: 12px;
            padding-right: 12px;
        }

        .tabs {
            overflow-x: auto;
        }

        .board-wrapper {
            width: 100%;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Chess Opening Trainer</h1>

    <nav class="tabs">
        <button class="tab" data-page="practice">Practice</button>
        <button class="tab active" data-page="learn">Learn</button>
        <button class="tab" data-page="repertoire">Repertoire</button>
    </nav>
</header>


<main>

    <!-- =====================================================
         PRACTICE
    ====================================================== -->

    <section id="practice" class="page">

        </div>

        <div class="placeholder">

        </div>

    </section>


    <!-- =====================================================
         LEARN
    ====================================================== -->

    <section id="learn" class="page active">

        <div class="page-header">
            <h2>Learn</h2>
            <p>Learn openings through guided play, explanations, variations, and tactics.</p>
        </div>

        <div class="learn-layout">

            <aside class="panel">

                <h3>Opening Library</h3>

                <div id="openingList" class="opening-list"></div>

            </aside>


            <section class="panel">

                <div id="lesson">

                    <div class="lesson-top">

                        <div>
                            <h3 id="openingTitle"></h3>

                            <div
                                id="openingDescription"
                                class="opening-meta"
                            ></div>
                        </div>

                        <span
                            id="difficulty"
                            class="difficulty"
                        ></span>

                    </div>


                    <div class="board-area">

                        <div class="board-wrapper">

                            <div id="board" class="board"></div>

                            <div class="progress">
                                <div
                                    id="progressBar"
                                    class="progress-bar"
                                ></div>
                            </div>

                        </div>


                        <div class="lesson-content">

                            <h4 id="lessonTitle"></h4>

                            <div
                                id="lessonText"
                                class="lesson-text"
                            ></div>

                            <div
                                id="movePrompt"
                                class="move-prompt"
                            ></div>

                            <div
                                id="feedback"
                                class="feedback"
                            ></div>

                            <div
                                id="variationList"
                                class="variation-list hidden"
                            ></div>

                            <div class="controls">

                                <button
                                    id="hintButton"
                                    class="secondary"
                                >
                                    Hint
                                </button>

                                <button
                                    id="explainButton"
                                    class="secondary"
                                >
                                    Explain Further
                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </section>


    <!-- =====================================================
         REPERTOIRE
    ====================================================== -->

    <section id="repertoire" class="page">

        <div class="page-header">

            <h2>Repertoire</h2>

            <p>
                Your learned openings and quick refreshers.
            </p>

        </div>

        <div id="repertoireContent"></div>

    </section>

</main>


<script>

/* =========================================================
   TAB SYSTEM
========================================================= */

const tabs = document.querySelectorAll(".tab");
const pages = document.querySelectorAll(".page");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        const target = tab.dataset.page;

        tabs.forEach(t =>
            t.classList.remove("active")
        );

        pages.forEach(p =>
            p.classList.remove("active")
        );

        tab.classList.add("active");

        document
            .getElementById(target)
            .classList.add("active");

        if (target === "repertoire") {
            updateRepertoire();
        }
    });

});

/* =========================================================
   OPENING DATA

   ========================================================
   THIS IS THE ONLY SECTION YOU NEED TO EDIT TO ADD CONTENT.
   ========================================================

   Every opening has:

       id
       name
       difficulty
       description
       introSteps
       variations
       keyIdeas

   --------------------------------------------------------
   ADDING A NEW OPENING
   --------------------------------------------------------

   Copy this structure:

       "your-opening-id": {

           name: "Your Opening",

           difficulty: "Intermediate",

           description:
               "Short description of the opening.",

           introSteps: [

               {
                   title: "First idea",

                   text:
                       "Explanation of the position.",

                   prompt:
                       "Play e4.",

                   from: "e2",
                   to: "e4",

                   explanation:
                       "Why this move is good."
               }

           ],

           variations: {

               main: {

                   name: "Main Line",

                   description:
                       "Description of this variation.",

                   steps: [

                       {
                           title: "Next move",

                           text:
                               "Explain what Black did.",

                           prompt:
                               "Play Nf3.",

                           from: "g1",
                           to: "f3",

                           opponent: {
                               from: "e7",
                               to: "e5"
                           },

                           explanation:
                               "Why this move matters."
                       }

                   ]
               }

           },

           keyIdeas: [
               "First important idea.",
               "Second important idea.",
               "Third important idea."
           ]
       }

   --------------------------------------------------------
   IMPORTANT ABOUT opponent
   --------------------------------------------------------

   The opponent move belongs on the STEP that follows the
   White move it responds to.

   Example:

       White plays e4.

   Then the NEXT step contains:

       opponent: {
           from: "e7",
           to: "e5"
       }

   The engine automatically plays ...e5 before displaying
   that next lesson step.

   --------------------------------------------------------
   CASTLING
   --------------------------------------------------------

   For castling:

       from: "e1",
       to: "g1",
       special: "castle"

   or queenside:

       from: "e1",
       to: "c1",
       special: "castle"

   The engine moves both the king and rook automatically.

   --------------------------------------------------------
   TACTICS
   --------------------------------------------------------

   Add:

       tactic: true

   to a move where you want the hint system to recognize
   that the player is supposed to find a tactical move.

   --------------------------------------------------------
   STARTING POSITION
   --------------------------------------------------------

   By default every opening starts from the normal chess
   starting position.

   If you ever need a custom starting position, add:

       startingPosition: {
           ...
       }

   to the opening.

   ======================================================== */

/* =========================================================
   STATE
========================================================= */

let currentOpeningId = "scotch-gambit";

let pieces = {};

let selectedSquare = null;

let inputLocked = false;

let currentStage = "intro";

let currentStep = 0;

let wrongAttempts = 0;

let completedStages = new Set();


/* =========================================================
   PROGRESS STORAGE
========================================================= */

const STORAGE_KEY =
    "chessOpeningTrainerProgress";


function getProgressData() {

    const defaultData = {
        learned: {},
        completed: {}
    };

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return defaultData;
    }

    try {

        const parsed =
            JSON.parse(saved);

        return {
            learned: parsed.learned || {},
            completed: parsed.completed || {}
        };

    } catch (error) {

        console.log(
            "Could not load opening progress."
        );

        return defaultData;
    }
}


function saveProgressData(data) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


function markOpeningLearned(openingId) {

    const data =
        getProgressData();

    data.learned[openingId] = true;

    saveProgressData(data);
}


function isOpeningLearned(openingId) {

    const data =
        getProgressData();

    return data.learned[openingId] === true;
}


function saveCompletedStages() {

    const data =
        getProgressData();

    data.completed[currentOpeningId] =
        [...completedStages];

    saveProgressData(data);
}


function loadCompletedStages() {

    const data =
        getProgressData();

    const saved =
        data.completed[currentOpeningId] || [];

    completedStages =
        new Set(saved);
}


/* =========================================================
   OPENING HELPERS
========================================================= */

function getCurrentOpening() {

    return OPENINGS[currentOpeningId];
}


function getStageOrder() {

    const opening =
        getCurrentOpening();

    return [
        "intro",
        ...Object.keys(opening.variations)
    ];
}


function getStepsForStage(stage) {

    const opening =
        getCurrentOpening();

    if (stage === "intro") {
        return opening.introSteps;
    }

    return opening.variations[stage].steps;
}


function getCurrentStep() {

    const steps =
        getStepsForStage(currentStage);

    return steps[currentStep];
}


/* =========================================================
   BOARD POSITION HELPERS
========================================================= */

function clonePosition(position) {

    return {
        ...position
    };
}


function applyStepToPosition(position, step) {

    if (step.opponent) {

        makeMoveOnPosition(
            position,
            step.opponent.from,
            step.opponent.to
        );
    }

    if (step.special === "castle") {

        castleOnPosition(
            position,
            step.from,
            step.to
        );

    } else {

        makeMoveOnPosition(
            position,
            step.from,
            step.to
        );
    }
}


function getOpeningBasePosition() {

    const opening =
        getCurrentOpening();

    const position =
        clonePosition(
            opening.startingPosition ||
            startingPosition
        );

    /*
       Build the exact position after the opening intro.

       Each intro step has an opponent reply that belongs
       to that step, followed by the White move itself.
    */

    opening.introSteps.forEach(step => {

        if (step.opponent) {

            makeMoveOnPosition(
                position,
                step.opponent.from,
                step.opponent.to
            );
        }

        if (step.special === "castle") {

            castleOnPosition(
                position,
                step.from,
                step.to
            );

        } else {

            makeMoveOnPosition(
                position,
                step.from,
                step.to
            );
        }
    });

    return position;
}


function getPositionBeforeStage(stage) {

    if (stage === "intro") {

        const opening =
            getCurrentOpening();

        return clonePosition(
            opening.startingPosition ||
            startingPosition
        );
    }

    /*
       Every variation begins from the position after
       the opening's intro.
    */

    return getOpeningBasePosition();
}


/* =========================================================
   BOARD
========================================================= */

function renderBoard() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    for (let rank = 8; rank >= 1; rank--) {

        for (
            let fileIndex = 0;
            fileIndex < 8;
            fileIndex++
        ) {

            const file =
                String.fromCharCode(
                    97 + fileIndex
                );

            const squareName =
                file + rank;

            const square =
                document.createElement("div");

            square.className =
                "square " +
                (
                    (fileIndex + rank) % 2 === 0
                        ? "dark"
                        : "light"
                );

            if (
                squareName === selectedSquare
            ) {

                square.classList.add(
                    "selected"
                );
            }

            const piece =
                pieces[squareName];

            if (piece) {

                square.innerHTML =
                    pieceSVG[piece];
            }

            square.addEventListener(
                "click",
                () =>
                    handleSquareClick(
                        squareName
                    )
            );

            board.appendChild(square);
        }
    }
}


/* =========================================================
   MOVE FUNCTIONS
========================================================= */

function makeMoveOnPosition(
    position,
    from,
    to
) {

    if (!position[from]) {
        return;
    }

    position[to] =
        position[from];

    delete position[from];
}


function makeMove(from, to) {

    makeMoveOnPosition(
        pieces,
        from,
        to
    );
}


/* =========================================================
   CASTLING
========================================================= */

function castleOnPosition(
    position,
    from,
    to
) {

    const king =
        position[from];

    if (!king) {
        return;
    }

    const isWhite =
        king === "wK";

    const rank =
        isWhite ? "1" : "8";

    const kingside =
        to === "g" + rank;

    const queenside =
        to === "c" + rank;

    if (!kingside && !queenside) {
        return;
    }

    const rookFrom =
        kingside
            ? "h" + rank
            : "a" + rank;

    const rookTo =
        kingside
            ? "f" + rank
            : "d" + rank;

    position[to] =
        position[from];

    delete position[from];

    if (position[rookFrom]) {

        position[rookTo] =
            position[rookFrom];

        delete position[rookFrom];
    }
}


function castle(from, to) {

    castleOnPosition(
        pieces,
        from,
        to
    );
}


/* =========================================================
   OPENING LIBRARY
========================================================= */

function renderOpeningLibrary() {

    const container =
        document.getElementById(
            "openingList"
        );

    container.innerHTML = "";

    Object.entries(OPENINGS)
        .forEach(([id, opening]) => {

            const button =
                document.createElement("button");

            button.className =
                "opening";

            if (id === currentOpeningId) {

                button.classList.add(
                    "selected"
                );
            }

            const learned =
                isOpeningLearned(id);

            button.innerHTML = `

                <span class="opening-name">
                    ${escapeHTML(opening.name)}
                </span>

                <span class="opening-meta">
                    ${escapeHTML(opening.difficulty)}
                </span>

                ${
                    learned
                        ? `
                            <span class="learned-badge">
                                Learned
                            </span>
                          `
                        : ""
                }
            `;

            button.addEventListener(
                "click",
                () => selectOpening(id)
            );

            container.appendChild(button);
        });
}


function selectOpening(openingId) {

    if (!OPENINGS[openingId]) {
        return;
    }

    currentOpeningId =
        openingId;

    currentStage =
        "intro";

    currentStep =
        0;

    selectedSquare =
        null;

    inputLocked =
        false;

    wrongAttempts =
        0;

    loadCompletedStages();

    resetLesson();

    renderOpeningLibrary();
}


/* =========================================================
   OPENING HEADER
========================================================= */

function updateOpeningHeader() {

    const opening =
        getCurrentOpening();

    document.getElementById(
        "openingTitle"
    ).textContent =
        opening.name;

    document.getElementById(
        "openingDescription"
    ).textContent =
        opening.description;

    document.getElementById(
        "difficulty"
    ).textContent =
        opening.difficulty;
}


/* =========================================================
   MOVE INPUT
========================================================= */

function handleSquareClick(squareName) {

    if (inputLocked) {
        return;
    }

    const step =
        getCurrentStep();

    if (!step) {
        return;
    }


    if (!selectedSquare) {

        /*
           Only allow selecting White pieces.
        */

        if (
            pieces[squareName] &&
            pieces[squareName].startsWith("w")
        ) {

            selectedSquare =
                squareName;

            renderBoard();
        }

        return;
    }


    if (
        squareName === selectedSquare
    ) {

        selectedSquare =
            null;

        renderBoard();

        return;
    }


    if (
        selectedSquare === step.from &&
        squareName === step.to
    ) {

        completeCurrentMove();

    } else {

        wrongAttempts++;

        const feedback =
            document.getElementById(
                "feedback"
            );

        if (
            step.tactic &&
            wrongAttempts >= 2
        ) {

            feedback.textContent =
                getTacticHint(step);

        } else {

            feedback.textContent =
                "That's not the move we're looking for. Try again.";
        }

        feedback.className =
            "feedback wrong";

        selectedSquare =
            null;

        renderBoard();
    }
}


function getTacticHint(step) {

    if (step.tacticHint) {

        return step.tacticHint;
    }

    return (
        "Hint: look for a checking move " +
        "that creates another threat."
    );
}


/* =========================================================
   COMPLETE MOVE
========================================================= */

function completeCurrentMove() {

    const step =
        getCurrentStep();

    inputLocked =
        true;

    wrongAttempts =
        0;

    if (step.special === "castle") {

        castle(
            step.from,
            step.to
        );

    } else {

        makeMove(
            step.from,
            step.to
        );
    }

    selectedSquare =
        null;

    renderBoard();

    const feedback =
        document.getElementById(
            "feedback"
        );

    feedback.textContent =
        "Correct!";

    feedback.className =
        "feedback correct";

    setTimeout(
        () => advanceLesson(),
        550
    );
}


/* =========================================================
   ADVANCE
========================================================= */

function advanceLesson() {

    currentStep++;

    inputLocked =
        false;

    const steps =
        getStepsForStage(
            currentStage
        );

    if (
        currentStep >= steps.length
    ) {

        finishStage();

        return;
    }

    enterStep();
}


/* =========================================================
   ENTER STEP
========================================================= */

function enterStep() {

    const step =
        getCurrentStep();

    if (
        step &&
        step.opponent
    ) {

        makeMove(
            step.opponent.from,
            step.opponent.to
        );
    }

    renderBoard();

    updateLesson();
}


/* =========================================================
   UPDATE LESSON
========================================================= */

function updateLesson() {

    const title =
        document.getElementById(
            "lessonTitle"
        );

    const text =
        document.getElementById(
            "lessonText"
        );

    const prompt =
        document.getElementById(
            "movePrompt"
        );

    const feedback =
        document.getElementById(
            "feedback"
        );

    const variationList =
        document.getElementById(
            "variationList"
        );


    feedback.textContent =
        "";

    feedback.className =
        "feedback";

    variationList.classList.add(
        "hidden"
    );

    variationList.innerHTML =
        "";


    const step =
        getCurrentStep();

    if (!step) {
        return;
    }

    title.textContent =
        step.title;

    text.textContent =
        step.text;

    prompt.textContent =
        step.prompt;

    updateProgressBar();
}


/* =========================================================
   PROGRESS
========================================================= */

function getTotalStepCount() {

    const opening =
        getCurrentOpening();

    let total =
        opening.introSteps.length;

    Object.values(
        opening.variations
    ).forEach(variation => {

        total +=
            variation.steps.length;
    });

    return total;
}


function getCompletedStepCount() {

    const opening =
        getCurrentOpening();

    const stageOrder =
        getStageOrder();

    let completed =
        0;

    for (
        let i = 0;
        i < stageOrder.length;
        i++
    ) {

        const stage =
            stageOrder[i];

        if (
            stage === currentStage
        ) {

            completed +=
                currentStep;

            break;
        }

        completed +=
            getStepsForStage(stage).length;
    }

    return completed;
}


function updateProgressBar() {

    const progress =
        document.getElementById(
            "progressBar"
        );

    const total =
        getTotalStepCount();

    const completed =
        getCompletedStepCount();

    const percentage =
        total > 0
            ? completed / total * 100
            : 0;

    progress.style.width =
        Math.min(
            100,
            percentage
        ) + "%";
}


/* =========================================================
   FINISH STAGE
========================================================= */

function finishStage() {

    const stageOrder =
        getStageOrder();

    const stageIndex =
        stageOrder.indexOf(
            currentStage
        );

    if (
        currentStage === "intro"
    ) {

        showIntroComplete();

        return;
    }

    completedStages.add(
        currentStage
    );

    saveCompletedStages();

    showVariationComplete(
        currentStage
    );
}


/* =========================================================
   INTRO COMPLETE
========================================================= */

function showIntroComplete() {

    const opening =
        getCurrentOpening();

    const title =
        document.getElementById(
            "lessonTitle"
        );

    const text =
        document.getElementById(
            "lessonText"
        );

    const prompt =
        document.getElementById(
            "movePrompt"
        );

    const feedback =
        document.getElementById(
            "feedback"
        );

    feedback.textContent =
        "";

    feedback.className =
        "feedback";

    title.textContent =
        opening.name;

    text.textContent =
        "You've reached the position that defines the opening. " +
        "Now let's look at the major variations and ideas " +
        "you need to know.";

    prompt.textContent =
        "";

    updateProgressBar();

    const stageOrder =
        getStageOrder();

    const nextStage =
        stageOrder[1];

    if (nextStage) {

        showContinueButton(
            nextStage
        );

    } else {

        finishOpening();
    }
}


/* =========================================================
   VARIATION COMPLETE
========================================================= */

function showVariationComplete(stage) {

    const opening =
        getCurrentOpening();

    const variation =
        opening.variations[stage];

    const title =
        document.getElementById(
            "lessonTitle"
        );

    const text =
        document.getElementById(
            "lessonText"
        );

    const prompt =
        document.getElementById(
            "movePrompt"
        );

    const feedback =
        document.getElementById(
            "feedback"
        );

    feedback.textContent =
        "";

    feedback.className =
        "feedback";

    title.textContent =
        variation.name +
        " complete";

    text.textContent =
        getVariationSummary(
            variation
        );

    updateProgressBar();

    const stageOrder =
        getStageOrder();

    const stageIndex =
        stageOrder.indexOf(stage);

    const nextStage =
        stageOrder[
            stageIndex + 1
        ];

    if (nextStage) {

        prompt.textContent =
            "Continue to the next line.";

        showContinueButton(
            nextStage
        );

    } else {

        finishOpening();
    }
}


/* =========================================================
   OPENING COMPLETE
========================================================= */

function finishOpening() {

    const opening =
        getCurrentOpening();

    markOpeningLearned(
        currentOpeningId
    );

    renderOpeningLibrary();

    const title =
        document.getElementById(
            "lessonTitle"
        );

    const text =
        document.getElementById(
            "lessonText"
        );

    const prompt =
        document.getElementById(
            "movePrompt"
        );

    const variationList =
        document.getElementById(
            "variationList"
        );

    title.textContent =
        opening.name +
        " learned ✓";

    text.innerHTML = `
        You've completed every lesson line
        for this opening.

        <div class="summary">

            <strong>Key ideas</strong>

            <br><br>

            ${opening.keyIdeas
                .map(
                    idea =>
                        "• " +
                        escapeHTML(idea)
                )
                .join("<br>")}

        </div>
    `;

    prompt.textContent =
        "Opening learned ✓";

    variationList.classList.add(
        "hidden"
    );

    variationList.innerHTML =
        "";

    updateProgressBar();
}


/* =========================================================
   CONTINUE BUTTON
========================================================= */

function showContinueButton(nextStage) {

    const variationList =
        document.getElementById(
            "variationList"
        );

    variationList.classList.remove(
        "hidden"
    );

    variationList.innerHTML =
        "";

    const opening =
        getCurrentOpening();

    const variation =
        opening.variations[
            nextStage
        ];

    if (!variation) {
        return;
    }

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "variation-button";

    button.innerHTML = `
        <strong>
            Continue → ${escapeHTML(variation.name)}
        </strong>

        <span>
            ${escapeHTML(variation.description)}
        </span>
    `;

    button.addEventListener(
        "click",
        () =>
            advanceToNextStage(
                nextStage
            )
    );

    variationList.appendChild(
        button
    );
}


/* =========================================================
   ADVANCE TO NEXT STAGE
========================================================= */

function advanceToNextStage(
    nextStage
) {

    currentStage =
        nextStage;

    currentStep =
        0;

    selectedSquare =
        null;

    inputLocked =
        false;

    wrongAttempts =
        0;

    /*
       Every variation starts from the exact position
       reached after the opening's intro.
    */

    pieces =
        getPositionBeforeStage(
            nextStage
        );

    enterStep();
}


/* =========================================================
   VARIATION SUMMARY
========================================================= */

function getVariationSummary(
    variation
) {

    if (variation.summary) {
        return variation.summary;
    }

    return variation.description;
}


/* =========================================================
   HINT
========================================================= */

document
    .getElementById("hintButton")
    .addEventListener(
        "click",
        () => {

            const step =
                getCurrentStep();

            const feedback =
                document.getElementById(
                    "feedback"
                );

            if (!step) {

                feedback.textContent =
                    "Click Continue to move on.";

                return;
            }

            if (
                step.tactic &&
                wrongAttempts >= 1
            ) {

                feedback.textContent =
                    getTacticHint(step);

                feedback.className =
                    "feedback";

                return;
            }

            feedback.textContent =
                "Hint: move the piece from " +
                step.from.toUpperCase() +
                " to " +
                step.to.toUpperCase() +
                ".";

            feedback.className =
                "feedback";
        }
    );


/* =========================================================
   EXPLAIN FURTHER
========================================================= */

document
    .getElementById("explainButton")
    .addEventListener(
        "click",
        () => {

            const step =
                getCurrentStep();

            const feedback =
                document.getElementById(
                    "feedback"
                );

            if (!step) {

                feedback.textContent =
                    "This opening's main ideas are explained " +
                    "through the lesson lines and key ideas.";

                return;
            }

            feedback.textContent =
                step.explanation ||
                "This move fits the strategic ideas of the opening.";

            feedback.className =
                "feedback";
        }
    );


/* =========================================================
   REPERTOIRE
========================================================= */

function updateRepertoire() {

    const container =
        document.getElementById(
            "repertoireContent"
        );

    const learnedOpenings =
        Object.entries(OPENINGS)
            .filter(
                ([id]) =>
                    isOpeningLearned(id)
            );

    if (
        learnedOpenings.length === 0
    ) {

        container.innerHTML = `
            <div class="placeholder">
                You have not learned any openings yet.
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    learnedOpenings.forEach(
        ([id, opening]) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "repertoire-card";

            card.innerHTML = `

                <h3>
                    ${escapeHTML(opening.name)}
                </h3>

                <p>
                    Learned. You completed
                    the lesson for this opening.
                </p>

                <button
                    class="primary"
                    data-refresh="${escapeHTML(id)}"
                >
                    Refresh ${escapeHTML(opening.name)}
                </button>
            `;

            card
                .querySelector(
                    "[data-refresh]"
                )
                .addEventListener(
                    "click",
                    () => {

                        document
                            .querySelector(
                                '[data-page="learn"]'
                            )
                            .click();

                        selectOpening(id);
                    }
                );

            container.appendChild(
                card
            );
        }
    );
}


/* =========================================================
   RESET LESSON
========================================================= */

function resetLesson() {

    const opening =
        getCurrentOpening();

    pieces =
        clonePosition(
            opening.startingPosition ||
            startingPosition
        );

    selectedSquare =
        null;

    inputLocked =
        false;

    currentStage =
        "intro";

    currentStep =
        0;

    wrongAttempts =
        0;

    updateOpeningHeader();

    renderBoard();

    enterStep();
}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   INITIALIZE
========================================================= */

renderOpeningLibrary();

loadCompletedStages();

resetLesson();

</script>
