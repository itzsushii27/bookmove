<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chess Opening Trainer</title>
<style>
*{box-sizing:border-box}
:root{--bg:#111315;--panel:#1b1e21;--panel-2:#22262a;--border:#34393e;--text:#f2f2f2;--muted:#a6abb0;--muted-2:#777d83;--button:#292e33;--button-hover:#353b41;--accent:#d8d8d8;--good:#55c878;--bad:#ef6262;--board-light:#f0d9b5;--board-dark:#b58863}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}
header{background:#090a0b;color:white;padding:18px 24px 0;border-bottom:1px solid var(--border)}
header h1{max-width:1250px;margin:0 auto 16px;font-size:24px}
.tabs{display:flex;gap:6px;max-width:1250px;margin:auto}
.tab{border:0;background:transparent;color:#777;padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:#bbb}.tab.active{color:white;border-bottom-color:white}
main{max-width:1250px;margin:auto;padding:28px 20px 50px}
.page{display:none}.page.active{display:block}
.page-header{margin-bottom:24px}.page-header h2{margin:0 0 7px;font-size:28px}.page-header p{margin:0;color:var(--muted)}
.learn-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
.panel h3{margin:0 0 14px}
.opening-list{display:flex;flex-direction:column;gap:8px}
.opening{width:100%;text-align:left;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:7px;padding:12px;cursor:pointer}
.opening:hover,.opening.selected{background:var(--button-hover);border-color:#666}.opening:disabled{cursor:default;opacity:.55}
.opening-name{display:block;font-weight:bold;margin-bottom:4px}.opening-meta{color:var(--muted);font-size:13px}
.learned-badge{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#30353a;color:#ccc;font-size:11px;font-weight:bold}
.lesson-top{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.lesson-top h3{margin:0 0 6px;font-size:24px}
.difficulty{border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:12px;color:var(--muted);height:fit-content;white-space:nowrap}
.board-area{display:grid;grid-template-columns:520px minmax(400px,1fr);gap:28px;align-items:start}
.board-wrapper{width:520px}
.board{width:520px;height:520px;display:grid;grid-template-columns:repeat(8,65px);grid-template-rows:repeat(8,65px);border:2px solid #080808;overflow:hidden}
.square{width:65px;height:65px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.square.light{background:var(--board-light)}.square.dark{background:var(--board-dark)}
.square.selected{outline:4px solid #555;outline-offset:-4px}
.piece{width:84%;height:84%;display:block;pointer-events:none;user-select:none}
.lesson-content{min-height:330px}.lesson-content h4{margin:0 0 10px;font-size:18px}
.lesson-text{line-height:1.55;color:#d1d4d7;margin-bottom:18px}
.move-prompt{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;font-weight:bold}
.feedback{min-height:42px;margin-bottom:12px;font-size:14px;line-height:1.45}.feedback.correct{color:var(--good)}.feedback.wrong{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.primary,.secondary,.variation-button{border-radius:7px;padding:10px 15px;cursor:pointer}
.primary{border:0;background:#eee;color:#111}.primary:hover{background:#fff}
.secondary{border:1px solid var(--border);background:var(--button);color:var(--text)}.secondary:hover{background:var(--button-hover)}
.variation-list{display:grid;gap:9px;margin-top:16px}.variation-button{border:1px solid var(--border);background:var(--panel-2);color:var(--text);text-align:left}
.variation-button:hover,.variation-button.selected{background:var(--button-hover);border-color:#777}
.variation-button strong{display:block;margin-bottom:3px}.variation-button span{color:var(--muted);font-size:12px}
.progress{width:520px;height:6px;background:#303438;border-radius:999px;overflow:hidden;margin-top:20px}.progress-bar{height:100%;width:0%;background:#aaa;transition:width .25s ease}
.summary{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:15px;line-height:1.55}
.hidden{display:none!important}.placeholder{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:30px;color:var(--muted)}
.repertoire-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:12px}.repertoire-card h3{margin:0 0 7px}.repertoire-card p{color:var(--muted);margin:0 0 14px}
@media(max-width:1050px){.board-area{grid-template-columns:520px 1fr}.lesson-content{min-width:0}}
@media(max-width:850px){.learn-layout{grid-template-columns:1fr}.board-area{grid-template-columns:1fr}.board-wrapper{width:520px;max-width:100%;overflow-x:auto}.lesson-content{min-width:0}}
@media(max-width:600px){main{padding-left:12px;padding-right:12px}header{padding-left:12px;padding-right:12px}.tabs{overflow-x:auto}.board-wrapper{width:100%}}
</style>
</head>
<body>

<header>
<h1>Chess Opening Trainer</h1>
<nav class="tabs">
<button class="tab" data-page="practice">Practice</button>
<button class="tab active" data-page="learn">Learn</button>
<button class="tab" data-page="repertoire">Repertoire</button>
</nav>
</header>

<main>

<section id="practice" class="page">
<div class="page-header"><h2>Practice</h2><p>Practice openings against practical, rating-based responses.</p></div>
<div class="placeholder">Practice mode will be built after Learn.</div>
</section>

<section id="learn" class="page active">
<div class="page-header"><h2>Learn</h2><p>Learn openings through guided play, explanations, variations, and tactics.</p></div>
<div class="learn-layout">

<aside class="panel">
<h3>Opening Library</h3>
<div id="openingList" class="opening-list"></div>
</aside>

<section class="panel">
<div id="lesson">

<div class="lesson-top">
<div><h3 id="openingTitle"></h3><div id="openingDescription" class="opening-meta"></div></div>
<span id="difficulty" class="difficulty"></span>
</div>

<div class="board-area">
<div class="board-wrapper">
<div id="board" class="board"></div>
<div class="progress"><div id="progressBar" class="progress-bar"></div></div>
</div>

<div class="lesson-content">
<h4 id="lessonTitle"></h4>
<div id="lessonText" class="lesson-text"></div>
<div id="movePrompt" class="move-prompt"></div>
<div id="feedback" class="feedback"></div>
<div id="variationList" class="variation-list hidden"></div>
<div class="controls">
<button id="hintButton" class="secondary">Hint</button>
<button id="explainButton" class="secondary">Explain Further</button>
</div>
</div>
</div>

</div>
</section>

</div>
</section>

<section id="repertoire" class="page">
<div class="page-header"><h2>Repertoire</h2><p>Your learned openings and quick refreshers.</p></div>
<div id="repertoireContent"></div>
</section>

</main>

/* =========================================================
   STATE
========================================================= */

let currentOpeningId="scotch-gambit",pieces={},selectedSquare=null,inputLocked=false,currentStage="intro",currentStep=0,wrongAttempts=0,completedStages=new Set();


/* =========================================================
   PROGRESS
========================================================= */

const STORAGE_KEY="chessOpeningTrainerProgress";

function getProgressData(){
const saved=localStorage.getItem(STORAGE_KEY);
if(!saved)return{learned:{},completed:{}};
try{
const parsed=JSON.parse(saved);
return{learned:parsed.learned||{},completed:parsed.completed||{}};
}catch(error){return{learned:{},completed:{}}}
}

function saveProgressData(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function markOpeningLearned(id){const data=getProgressData();data.learned[id]=true;saveProgressData(data)}
function isOpeningLearned(id){return getProgressData().learned[id]===true}
function saveCompletedStages(){const data=getProgressData();data.completed[currentOpeningId]=[...completedStages];saveProgressData(data)}
function loadCompletedStages(){const data=getProgressData();completedStages=new Set(data.completed[currentOpeningId]||[])}


/* =========================================================
   OPENING HELPERS
========================================================= */

function getCurrentOpening(){return OPENINGS[currentOpeningId]}
function getStageOrder(){return["intro",...Object.keys(getCurrentOpening().variations)]}
function getStepsForStage(stage){return stage==="intro"?getCurrentOpening().introSteps:getCurrentOpening().variations[stage].steps}
function getCurrentStep(){return getStepsForStage(currentStage)[currentStep]}


/* =========================================================
   POSITION HELPERS
========================================================= */

function clonePosition(position){return{...position}}

function makeMoveOnPosition(position,from,to){
if(!position[from])return;
position[to]=position[from];
delete position[from];
}

function castleOnPosition(position,from,to){
const king=position[from];
if(!king)return;
const isWhite=king==="wK",rank=isWhite?"1":"8";
const kingside=to==="g"+rank,queenside=to==="c"+rank;
if(!kingside&&!queenside)return;
const rookFrom=kingside?"h"+rank:"a"+rank,rookTo=kingside?"f"+rank:"d"+rank;
position[to]=position[from];
delete position[from];
if(position[rookFrom]){position[rookTo]=position[rookFrom];delete position[rookFrom]}
}

function applyStepToPosition(position,step){
if(step.opponent)makeMoveOnPosition(position,step.opponent.from,step.opponent.to);
if(step.special==="castle")castleOnPosition(position,step.from,step.to);
else makeMoveOnPosition(position,step.from,step.to);
}

function getOpeningBasePosition(){
const opening=getCurrentOpening(),position=clonePosition(opening.startingPosition||startingPosition);
opening.introSteps.forEach(step=>applyStepToPosition(position,step));
return position;
}

function getPositionBeforeStage(stage){
if(stage==="intro")return clonePosition(getCurrentOpening().startingPosition||startingPosition);
return getOpeningBasePosition();
}


/* =========================================================
   BOARD
========================================================= */

function renderBoard(){
const board=document.getElementById("board");
board.innerHTML="";

for(let rank=8;rank>=1;rank--){
for(let fileIndex=0;fileIndex<8;fileIndex++){

const file=String.fromCharCode(97+fileIndex),squareName=file+rank,square=document.createElement("div");

square.className="square "+((fileIndex+rank)%2===0?"dark":"light");

if(squareName===selectedSquare)square.classList.add("selected");

const piece=pieces[squareName];
if(piece)square.innerHTML=pieceSVG[piece];

square.addEventListener("click",()=>handleSquareClick(squareName));
board.appendChild(square);
}
}
}


/* =========================================================
   MOVES
========================================================= */

function makeMove(from,to){makeMoveOnPosition(pieces,from,to)}
function castle(from,to){castleOnPosition(pieces,from,to)}


/* =========================================================
   OPENING LIBRARY
========================================================= */

function renderOpeningLibrary(){
const container=document.getElementById("openingList");
container.innerHTML="";

Object.entries(OPENINGS).forEach(([id,opening])=>{
const button=document.createElement("button");
button.className="opening";
if(id===currentOpeningId)button.classList.add("selected");

const learned=isOpeningLearned(id);

button.innerHTML=`<span class="opening-name">${escapeHTML(opening.name)}</span><span class="opening-meta">${escapeHTML(opening.difficulty)}</span>${learned?'<span class="learned-badge">Learned</span>':""}`;

button.addEventListener("click",()=>selectOpening(id));
container.appendChild(button);
});
}

function selectOpening(id){
if(!OPENINGS[id])return;
currentOpeningId=id;
currentStage="intro";
currentStep=0;
selectedSquare=null;
inputLocked=false;
wrongAttempts=0;
loadCompletedStages();
resetLesson();
renderOpeningLibrary();
}


/* =========================================================
   HEADER
========================================================= */

function updateOpeningHeader(){
const opening=getCurrentOpening();
document.getElementById("openingTitle").textContent=opening.name;
document.getElementById("openingDescription").textContent=opening.description;
document.getElementById("difficulty").textContent=opening.difficulty;
}


/* =========================================================
   MOVE INPUT
========================================================= */

function handleSquareClick(squareName){
if(inputLocked)return;

const step=getCurrentStep();
if(!step)return;

if(!selectedSquare){
if(pieces[squareName]&&pieces[squareName].startsWith("w")){
selectedSquare=squareName;
renderBoard();
}
return;
}

if(squareName===selectedSquare){
selectedSquare=null;
renderBoard();
return;
}

if(selectedSquare===step.from&&squareName===step.to){
completeCurrentMove();
}else{
wrongAttempts++;
const feedback=document.getElementById("feedback");

if(step.tactic&&wrongAttempts>=2)feedback.textContent=getTacticHint(step);
else feedback.textContent="That's not the move we're looking for. Try again.";

feedback.className="feedback wrong";
selectedSquare=null;
renderBoard();
}
}

function getTacticHint(step){
return step.tacticHint||"Hint: look for a checking move that creates another threat.";
}


/* =========================================================
   COMPLETE MOVE
========================================================= */

function completeCurrentMove(){
const step=getCurrentStep();
inputLocked=true;
wrongAttempts=0;

if(step.special==="castle")castle(step.from,step.to);
else makeMove(step.from,step.to);

selectedSquare=null;
renderBoard();

const feedback=document.getElementById("feedback");
feedback.textContent="Correct!";
feedback.className="feedback correct";

setTimeout(()=>advanceLesson(),550);
}


/* =========================================================
   ADVANCE
========================================================= */

function advanceLesson(){
currentStep++;
inputLocked=false;

const steps=getStepsForStage(currentStage);

if(currentStep>=steps.length){
finishStage();
return;
}

enterStep();
}

function enterStep(){
const step=getCurrentStep();

if(step&&step.opponent)makeMove(step.opponent.from,step.opponent.to);

renderBoard();
updateLesson();
}


/* =========================================================
   LESSON DISPLAY
========================================================= */

function updateLesson(){
const title=document.getElementById("lessonTitle"),text=document.getElementById("lessonText"),prompt=document.getElementById("movePrompt"),feedback=document.getElementById("feedback"),variationList=document.getElementById("variationList");

feedback.textContent="";
feedback.className="feedback";
variationList.classList.add("hidden");
variationList.innerHTML="";

const step=getCurrentStep();
if(!step)return;

title.textContent=step.title;
text.textContent=step.text;
prompt.textContent=step.prompt;
updateProgressBar();
}


/* =========================================================
   PROGRESS
========================================================= */

function getTotalStepCount(){
const opening=getCurrentOpening();
let total=opening.introSteps.length;
Object.values(opening.variations).forEach(v=>total+=v.steps.length);
return total;
}

function getCompletedStepCount(){
const stageOrder=getStageOrder();
let completed=0;

for(const stage of stageOrder){
if(stage===currentStage){
completed+=currentStep;
break;
}
completed+=getStepsForStage(stage).length;
}

return completed;
}

function updateProgressBar(){
const progress=document.getElementById("progressBar"),total=getTotalStepCount(),completed=getCompletedStepCount(),percentage=total>0?completed/total*100:0;
progress.style.width=Math.min(100,percentage)+"%";
}


/* =========================================================
   FINISH STAGES
========================================================= */

function finishStage(){
if(currentStage==="intro"){
showIntroComplete();
return;
}

completedStages.add(currentStage);
saveCompletedStages();
showVariationComplete(currentStage);
}

function showIntroComplete(){
const opening=getCurrentOpening(),title=document.getElementById("lessonTitle"),text=document.getElementById("lessonText"),prompt=document.getElementById("movePrompt"),feedback=document.getElementById("feedback");

feedback.textContent="";
feedback.className="feedback";
title.textContent=opening.name;
text.textContent="You've reached the position that defines the opening. Now let's look at the major variations and ideas you need to know.";
prompt.textContent="";
updateProgressBar();

const stageOrder=getStageOrder(),nextStage=stageOrder[1];

if(nextStage)showContinueButton(nextStage);
else finishOpening();
}

function showVariationComplete(stage){
const opening=getCurrentOpening(),variation=opening.variations[stage],title=document.getElementById("lessonTitle"),text=document.getElementById("lessonText"),prompt=document.getElementById("movePrompt"),feedback=document.getElementById("feedback");

feedback.textContent="";
feedback.className="feedback";
title.textContent=variation.name+" complete";
text.textContent=getVariationSummary(variation);
updateProgressBar();

const stageOrder=getStageOrder(),stageIndex=stageOrder.indexOf(stage),nextStage=stageOrder[stageIndex+1];

if(nextStage){
prompt.textContent="Continue to the next line.";
showContinueButton(nextStage);
}else finishOpening();
}

function finishOpening(){
const opening=getCurrentOpening();
markOpeningLearned(currentOpeningId);
renderOpeningLibrary();

const title=document.getElementById("lessonTitle"),text=document.getElementById("lessonText"),prompt=document.getElementById("movePrompt"),variationList=document.getElementById("variationList");

title.textContent=opening.name+" learned ✓";

text.innerHTML=`You've completed every lesson line for this opening.<div class="summary"><strong>Key ideas</strong><br><br>${opening.keyIdeas.map(idea=>"• "+escapeHTML(idea)).join("<br>")}</div>`;

prompt.textContent="Opening learned ✓";
variationList.classList.add("hidden");
variationList.innerHTML="";
updateProgressBar();
}


/* =========================================================
   CONTINUE
========================================================= */

function showContinueButton(nextStage){
const variationList=document.getElementById("variationList");
variationList.classList.remove("hidden");
variationList.innerHTML="";

const variation=getCurrentOpening().variations[nextStage];
if(!variation)return;

const button=document.createElement("button");
button.className="variation-button";
button.innerHTML=`<strong>Continue → ${escapeHTML(variation.name)}</strong><span>${escapeHTML(variation.description)}</span>`;
button.addEventListener("click",()=>advanceToNextStage(nextStage));
variationList.appendChild(button);
}

function advanceToNextStage(nextStage){
currentStage=nextStage;
currentStep=0;
selectedSquare=null;
inputLocked=false;
wrongAttempts=0;
pieces=getPositionBeforeStage(nextStage);
enterStep();
}

function getVariationSummary(variation){
return variation.summary||variation.description;
}


/* =========================================================
   HINT
========================================================= */

document.getElementById("hintButton").addEventListener("click",()=>{
const step=getCurrentStep(),feedback=document.getElementById("feedback");

if(!step){
feedback.textContent="Click Continue to move on.";
return;
}

if(step.tactic&&wrongAttempts>=1){
feedback.textContent=getTacticHint(step);
feedback.className="feedback";
return;
}

feedback.textContent="Hint: move the piece from "+step.from.toUpperCase()+" to "+step.to.toUpperCase()+".";
feedback.className="feedback";
});


/* =========================================================
   EXPLAIN FURTHER
========================================================= */

document.getElementById("explainButton").addEventListener("click",()=>{
const step=getCurrentStep(),feedback=document.getElementById("feedback");

if(!step){
feedback.textContent="This opening's main ideas are explained through the lesson lines and key ideas.";
return;
}

feedback.textContent=step.explanation||"This move fits the strategic ideas of the opening.";
feedback.className="feedback";
});


/* =========================================================
   REPERTOIRE
========================================================= */

function updateRepertoire(){
const container=document.getElementById("repertoireContent");

const learnedOpenings=Object.entries(OPENINGS).filter(([id])=>isOpeningLearned(id));

if(learnedOpenings.length===0){
container.innerHTML='<div class="placeholder">You have not learned any openings yet.</div>';
return;
}

container.innerHTML="";

learnedOpenings.forEach(([id,opening])=>{
const card=document.createElement("div");
card.className="repertoire-card";

card.innerHTML=`<h3>${escapeHTML(opening.name)}</h3><p>Learned. You completed the lesson for this opening.</p><button class="primary" data-refresh="${escapeHTML(id)}">Refresh ${escapeHTML(opening.name)}</button>`;

card.querySelector("[data-refresh]").addEventListener("click",()=>{
document.querySelector('[data-page="learn"]').click();
selectOpening(id);
});

container.appendChild(card);
});
}


/* =========================================================
   RESET
========================================================= */

function resetLesson(){
const opening=getCurrentOpening();

pieces=clonePosition(opening.startingPosition||startingPosition);
selectedSquare=null;
inputLocked=false;
currentStage="intro";
currentStep=0;
wrongAttempts=0;

updateOpeningHeader();
renderBoard();
enterStep();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){
return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}


/* =========================================================
   INITIALIZE
========================================================= */

renderOpeningLibrary();
loadCompletedStages();
resetLesson();
